// OTAku Android — app module build.gradle (Groovy DSL)
// Rust native backend (libotaku_native.so) built by cargo-ndk.
// .so files placed in jniLibs/<abi>/ by CI build step.

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.hoshiyomi.otaku'
    // T42: compileSdk 34 -> 35 — material 1.14.0 pulls androidx.core 1.16.0
    // (aar-metadata minCompileSdk=35). targetSdk stays 34 on purpose: bumping
    // it would opt into Android 15 edge-to-edge enforcement and change system
    // bar behavior on-device; compileSdk is build-time only.
    compileSdk 35

    defaultConfig {
        applicationId 'com.hoshiyomi.otaku'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // T24: NO ndk.abiFilters here. AGP UNIONs defaultConfig's filter
        // set into every product flavor, so declaring both ABIs at this
        // level silently un-filters arm7/arm8 — all three APKs shipped
        // BOTH ABIs (verified in Build run #274: arm7/arm8/universal
        // release APKs were byte-equal in size, each containing both
        // .so files). ABI filtering lives ONLY in productFlavors below.
    }

    flavorDimensions "abi"

    productFlavors {
        arm7 {
            dimension "abi"
            ndk { abiFilters 'armeabi-v7a' }
        }
        arm8 {
            dimension "abi"
            ndk { abiFilters 'arm64-v8a' }
        }
        universal {
            dimension "abi"
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }

    // APK output renaming moved to CI workflow (applicationVariants.all
    // interferes with R8 shrinking in AGP 8.4+)

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug // Use debug key for CI
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // T42 (MD3 Expressive): 1.12.0 → 1.14.0 — stable Expressive line:
    // Theme.Material3Expressive base themes, wavy progress indicators
    // (public attrs waveAmplitude/wavelength), expressive button styles
    // (shape-state morphing), spring motion styles, expressive alert
    // dialog overlay. The old "maintenance mode / final stable" note was
    // wrong — the 1.13/1.14 stable line shipped after it was written.
    // Verified against the 1.14.0 AAR (public.txt) + maven POMs:
    //   - core 1.16.0 transitively (minCompileSdk=35 — hence compileSdk 35)
    //   - appcompat 1.7.0 (minCompileSdk=34 — satisfied)
    implementation 'com.google.android.material:material:1.14.0'
    // Container-morph log panel: spring physics for the pill ↔ card settle
    // (M3 Expressive motion feel). Declared explicitly because
    // SpringAnimation / FloatValueHolder are referenced directly in
    // MainActivity — relying on material's transitive copy would break
    // if material ever drops or scopes it to implementation.
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
