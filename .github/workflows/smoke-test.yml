name: Smoke Test

# Runs BEFORE the main build workflow. Catches shell-level bugs and
# Rust unit test failures early — a build takes ~10 minutes per ABI,
# so failing fast saves CI minutes and gives faster feedback.
#
# Triggers:
#   - Any push to main (excluding docs-only changes)
#   - Any PR to main
#   - Manual dispatch

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke Test (shellcheck + Rust unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 1: Rust unit tests (host target — no NDK needed) ──
      # These tests run on the host x86_64-linux, not Android. They verify
      # the build_update_script() generator produces correct shell scripts
      # without actually running them. The unit tests include regression
      # tests that catch specific bugs we previously fixed.
      - name: Install Rust toolchain (stable, host only)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Run cargo test (host target, no Android cross-compile)
        working-directory: rust
        run: |
          # Insurance against a restored cache holding a stale target/dump
          # from an older commit: test_ci_dump_flasher_scripts rewrites it,
          # but if that test is ever removed/renamed the shellcheck steps
          # below would silently lint STALE scripts — delete first.
          rm -rf target/dump
          cargo test --verbose --lib 2>&1

      - name: Run cargo clippy (lint)
        working-directory: rust
        run: cargo clippy --lib --bins -- -D warnings 2>&1

      - name: Show test summary on failure
        if: failure()
        working-directory: rust
        run: |
          echo "=== Test failure — see output above ==="
          echo "Common causes:"
          echo "  1. Refactor reintroduced a previously-fixed bug (check regression tests)"
          echo "  2. Format string in build_update_script() changed without updating tests"
          echo "  3. New code path added but not covered by tests"
          exit 1

      # ── Step 2: Shellcheck the RENDERED flasher scripts ──
      # cargo test above already ran test_ci_dump_flasher_scripts, which
      # renders both verify variants of the update-binary to target/dump/
      # with every format!() arg substituted. We lint those — exact parity
      # with the Build workflow's shellcheck gate, but early (fail-fast).
      # This replaces the old "extract raw strings from dd.rs" approach,
      # which hard-coupled CI to the pre-T27 single-file layout (broke when
      # dd.rs was split into dd/{mod,script,tests}.rs) and skipped every
      # templated script anyway — i.e. most of them.
      - name: Verify flasher script dump exists
        working-directory: rust
        run: |
          set -e
          # Loud failure if the dump contract breaks — never lint nothing.
          for f in target/dump/update-binary.sh target/dump/update-binary-skip.sh; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f missing or empty — did test_ci_dump_flasher_scripts run?"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: Run shellcheck on dumped flasher scripts
        working-directory: rust
        run: |
          # Same files, same flags as the Build workflow's gate — this is
          # the fail-fast duplicate of that late gate. Excludes are
          # calibrated false positives:
          #   SC2034 PART_i_* vars are read via indirect expansion
          #   SC3043 'local' is busybox-ash (our recovery target), not POSIX
          #   SC3037 busybox echo flags
          shellcheck -s sh -S warning --exclude=SC2034,SC3043,SC3037 \
            target/dump/update-binary.sh
          shellcheck -s sh -S warning --exclude=SC2034,SC3043,SC3037 \
            target/dump/update-binary-skip.sh

      # ── Step 3: Brace balance check on the dd module (code only) ──
      # Catches a class of bugs where { or } is missing in code. Uses a
      # state machine that properly skips string literals, raw strings,
      # and comments — simple content.count() fails because shell scripts
      # inside raw strings contain unbalanced {{ / }} pairs.
      # Note: cargo test (Step 1) already verifies compilability — this is
      # a redundant safety net that catches stray braces early.
      # Scans rust/src/dd/*.rs (module glob) instead of the pre-T27 single
      # dd.rs file — resilient to future splits inside the module.
      - name: Verify Rust brace balance (dd module)
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          files = sorted(Path("rust/src/dd").glob("*.rs"))
          if not files:
              print("FAIL: no Rust sources found under rust/src/dd/")
              sys.exit(1)

          def brace_depth(content):
              # State machine: skips // and /* */ comments, "str" and r#"raw"#.
              i = 0; depth = 0
              in_line_cmt = in_block_cmt = in_str = in_raw = False
              raw_hashes = 0
              while i < len(content):
                  ch = content[i]
                  if in_line_cmt:
                      if ch == '\n': in_line_cmt = False
                      i += 1; continue
                  if in_block_cmt:
                      if ch == '*' and i+1 < len(content) and content[i+1] == '/':
                          in_block_cmt = False; i += 2; continue
                      i += 1; continue
                  if in_raw:
                      if ch == '"' and i+raw_hashes < len(content):
                          ok = all(content[i+1+h] == '#' for h in range(raw_hashes))
                          if ok: in_raw = False; i += 1+raw_hashes; continue
                      i += 1; continue
                  if in_str:
                      if ch == '\\': i += 2; continue
                      if ch == '"': in_str = False
                      i += 1; continue
                  if ch == '/' and i+1 < len(content):
                      if content[i+1] == '/': in_line_cmt = True; i += 2; continue
                      if content[i+1] == '*': in_block_cmt = True; i += 2; continue
                  if ch == '"': in_str = True; i += 1; continue
                  if ch == 'r' and i+1 < len(content) and content[i+1] == '#':
                      h = 0; j = i+1
                      while j < len(content) and content[j] == '#': h += 1; j += 1
                      if j < len(content) and content[j] == '"':
                          in_raw = True; raw_hashes = h; i = j+1; continue
                  if ch == '{': depth += 1
                  elif ch == '}': depth -= 1
                  i += 1
              return depth

          failed = False
          for f in files:
              content = f.read_text()
              depth = brace_depth(content)
              if depth != 0:
                  print(f"FAIL: {f} brace imbalance (code only) -- depth={depth}")
                  failed = True
              else:
                  tbo = content.count('{'); tbc = content.count('}')
                  print(f"PASS: {f.name} brace balance -- depth returns to 0 (raw braces: open={tbo}, close={tbc}, diff={tbo-tbc})")
          sys.exit(1 if failed else 0)
          PYEOF

      # ── Step 4: Sanity check — verify all format!() args are present ──
      # build_update_script uses named args ({script_version}, {header_info},
      # {part_vars}, ...). If any arg is missing in the format!() call but
      # referenced in the string, compilation fails — cargo test above
      # already proves that. This check is the readable arg contract: it
      # fails loudly when the template arg set evolves, forcing a conscious
      # list update instead of silent drift.
      # Scans the dd module glob — templates live in script.rs post-T27.
      - name: Sanity check format args (dd module)
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          content = "\n".join(f.read_text() for f in sorted(Path("rust/src/dd").glob("*.rs")))

          # All named format args used by build_update_script templates
          # (regenerated post-T27 against rust/src/dd/script.rs):
          required_args = [
              "script_version", "header_info", "part_vars", "num_parts", "compress_id",
              "extract_step", "verify_step", "integrity_step", "slot_step",
              "validation_step", "resize_step", "flash_step_offset",
              "num_parts_minus_1", "total_steps", "verify_block",
              "device_check_step", "escaped_device", "decomp_cmd",
              "fallback_decompressors", "free_space_step", "skip_verify_flag",
              "total_unc_size",
          ]
          # Verify zstd plumbing is present in the generated script
          zstd_checks = [
              ("zstd", "zstd DECOMP_PIPE"),
              ("zstdcat", "zstdcat fallback"),
              ("COMPRESS_ID", "COMPRESS_ID mapping"),
          ]
          for check, desc in zstd_checks:
              if check not in content:
                  print(f"WARNING: zstd check '{desc}' not found in dd module")
          missing = []
          for arg in required_args:
              if arg not in content:
                  missing.append(arg)

          if missing:
              print(f"FAIL: missing format args in dd module: {missing}")
              exit(1)
          print(f"PASS: all {len(required_args)} format args present")
          PYEOF

      # ── Step 5: Verify ZIP structure of a sample build ──
      # We can't run the full Rust build pipeline in smoke test (it needs
      # Android NDK), but we CAN verify the ZIP layout that run_dd_build
      # produces by checking the expected entries are documented in source.
      # Scans the dd module glob — ZIP assembly lives in mod.rs, the flasher
      # template references the entries in script.rs.
      - name: Verify ZIP structure expectations in source (dd module)
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          content = "\n".join(f.read_text() for f in sorted(Path("rust/src/dd").glob("*.rs")))

          # All expected ZIP entries that run_dd_build must create
          required_entries = [
              ("otaku.bin", "bundle binary"),
              ("flash_info.txt", "human-readable metadata"),
              ("META-INF/com/google/android/update-binary", "TWRP/OrangeFox flasher script"),
              ("META-INF/com/google/android/updater-script", "edify stub"),
          ]
          missing = []
          for entry, desc in required_entries:
              if entry not in content:
                  missing.append(f"{entry} ({desc})")

          if missing:
              print(f"FAIL: missing ZIP entry references in dd module: {missing}")
              exit(1)
          print(f"PASS: all {len(required_entries)} ZIP entries referenced in source")

          # Verify optimization features are present
          optimizations = [
              ("trim_pipe", "trim_pipe function (replaces head -c)"),
              ("oflag=direct", "O_DIRECT for block device writes"),
              ("NEED_TRIM", "NEED_TRIM optimization flag"),
              ("PCSIZE_BLOCKS", "PCSIZE_BLOCKS for block-aligned trim"),
          ]
          missing_opt = []
          for check, desc in optimizations:
              if check not in content:
                  missing_opt.append(f"{check} ({desc})")
          if missing_opt:
              print(f"FAIL: missing optimizations in dd module: {missing_opt}")
              exit(1)
          print(f"PASS: all {len(optimizations)} optimizations present")
          PYEOF

      # ── Step 6: Summary ──
      - name: Smoke test summary
        if: always()
        run: |
          echo "=========================================="
          echo "  Smoke Test Summary"
          echo "  Workflow: ${{ github.workflow }}"
          echo "  Commit:   ${{ github.sha }}"
          echo "  Branch:   ${{ github.ref_name }}"
          echo "  Actor:    ${{ github.actor }}"
          echo ""
          echo "Steps completed:"
          echo "  1. Rust unit tests (host target) + flasher script dump"
          echo "  2. Shellcheck on rendered flasher scripts (Build-gate parity)"
          echo "  3. Rust brace balance check (dd module)"
          echo "  4. Format args presence check (dd module)"
          echo "  5. ZIP structure expectations check (dd module)"
          echo "=========================================="
