name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    name: Build Rust native library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Run cargo clippy (lint)
        working-directory: rust
        run: cargo clippy --lib -- -D warnings 2>&1

      - name: Run cargo tests
        working-directory: rust
        run: cargo test --lib 2>&1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust .so (all ABIs)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Verify .so outputs
        run: |
          echo "=== arm64-v8a ==="
          ls -lh android/app/src/main/jniLibs/arm64-v8a/ || echo "MISSING"
          echo "=== armeabi-v7a ==="
          ls -lh android/app/src/main/jniLibs/armeabi-v7a/ || echo "MISSING"

          # Verify .so files exist and are valid ELF
          for abi in arm64-v8a armeabi-v7a; do
            SO_FILE="android/app/src/main/jniLibs/$abi/libotaku_native.so"
            if [ ! -f "$SO_FILE" ]; then
              echo "ERROR: $SO_FILE not found!"
              exit 1
            fi
            SIZE=$(stat -c%s "$SO_FILE" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 100000 ]; then
              echo "WARNING: $SO_FILE is suspiciously small ($SIZE bytes)"
            else
              echo "[OK] $SO_FILE: $(numfmt --to=iec $SIZE)"
            fi
          done

      - name: Upload Rust native libs
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-libs
          path: android/app/src/main/jniLibs/
          retention-days: 1
          # T24 rerun safety: re-runs re-upload the same name; without
          # overwrite the upload 409s against the earlier attempt's copy.
          overwrite: true

  build-android:
    name: Build APK (${{ matrix.target.label }})
    needs: build-rust
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - { flavor: Arm7, abi: arm7, label: ARMv7, expected_abis: 'armeabi-v7a' }
          - { flavor: Arm8, abi: arm8, label: ARMv8, expected_abis: 'arm64-v8a' }
          - { flavor: Universal, abi: universal, label: Universal, expected_abis: 'arm64-v8a armeabi-v7a' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Rust native libs
        uses: actions/download-artifact@v4
        with:
          name: rust-native-libs
          path: android/app/src/main/jniLibs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        working-directory: android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -qo gradle-8.6-bin.zip
          ./gradle-8.6/bin/gradle :app:assemble${{ matrix.target.flavor }}Release --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradle-8.6/bin/gradle :app:assemble${{ matrix.target.flavor }}Debug --no-daemon --stacktrace

      - name: Verify APK contains native lib
        working-directory: android
        run: |
          APK_FILE=$(find app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "WARNING: No release APK found to verify"
            exit 0
          fi
          echo "Verifying APK: $APK_FILE"
          if unzip -l "$APK_FILE" | grep -q "libotaku_native.so"; then
            echo "[OK] APK contains libotaku_native.so"
          else
            echo "ERROR: APK does NOT contain libotaku_native.so"
            exit 1
          fi

      - name: Verify APK ABI filtering (T24 regression guard)
        working-directory: android
        run: |
          APK_FILE=$(find app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "WARNING: No release APK found to verify"
            exit 0
          fi
          echo "Verifying ABI set: $APK_FILE"
          EXPECTED="${{ matrix.target.expected_abis }}"
          ACTUAL=$(unzip -l "$APK_FILE" | grep -oP 'lib/\K[^/]+(?=/libotaku_native\.so)' | sort -u | tr '\n' ' ' | xargs)
          echo "Expected ABIs: $EXPECTED"
          echo "Actual ABIs:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK ABI set mismatch — flavor ndk.abiFilters is not filtering"
            echo "Hint: defaultConfig must have NO ndk.abiFilters (AGP unions it into every flavor — T24)"
            exit 1
          fi
          echo "[OK] APK contains exactly the expected ABIs"

      - name: Upload release APK (+ R8 mapping)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OTAku-${{ matrix.target.abi }}-release
          path: |
            android/app/build/outputs/apk/**/release/*.apk
            android/app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OTAku-${{ matrix.target.abi }}-debug
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # T24 BUG-1: the GitHub run page lists artifacts PER ATTEMPT. After
  # "re-run failed jobs" (e.g. a transient Maven outage), the run summary
  # only shows artifacts uploaded during the latest attempt — everything
  # from earlier attempts disappears from the main page. This final job
  # re-publishes the complete bundle on the newest attempt so the page
  # always shows the full artifact set once the run is green.
  publish:
    name: Publish full artifact bundle
    needs: build-android
    runs-on: ubuntu-latest
    # Runs even when a build leg failed, so a post-rerun attempt
    # re-publishes the COMPLETE set. Skips only on cancellation.
    if: ${{ !cancelled() }}
    steps:
      - name: Download all per-ABI artifacts
        uses: actions/download-artifact@v4
        with:
          # Artifacts are run-scoped, not attempt-scoped: this also sees
          # artifacts uploaded by earlier attempts of the same run.
          pattern: OTAku-*
          path: dist
          merge-multiple: true
          if-no-files-found: error

      - name: Assemble flat bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          # APKs already carry unique names (app-<flavor>-<type>.apk)
          find dist -name '*.apk' -print -exec cp {} bundle/ \;
          # R8 mappings: prefix with the variant dir to keep them flat + unique
          find dist -name 'mapping.txt' | while read -r m; do
            variant="$(basename "$(dirname "$m")")"
            cp "$m" "bundle/mapping-${variant}.txt"
          done
          echo "=== bundle contents ==="
          ls -lh bundle/
          echo "APK count: $(find bundle -name '*.apk' | wc -l) (expect 6 = 3 flavors x 2 build types)"

      - name: Upload complete bundle
        uses: actions/upload-artifact@v4
        with:
          name: OTAku-all-builds
          path: bundle/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
