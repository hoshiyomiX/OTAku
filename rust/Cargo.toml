[package]
name = "otaku-native"
version = "1.0.0"
edition = "2021"
description = "OTAku native backend — Rust + JNI for Android"

[lib]
name = "otaku_native"
# cdylib = libotaku_native.so untuk Android (JNI).
# rlib   = T49: agar [[bin]] otaku-decomp di paket yang sama bisa
#          `use otaku_native::decomp` (cdylib saja tidak dilinkable ke bin).
#          .so output untuk Android tidak berubah.
crate-type = ["cdylib", "rlib"]

# T49: bundled universal decompressor shipped inside every flashable ZIP.
# Same crate, same codecs (flate2/bzip2/xz2/lz4_flex/zstd) — zero new deps;
# the thin CLI wrapper lives in src/bin/otaku_decomp.rs, the engine in
# src/decomp.rs (unit-tested with the lib under `cargo test --lib`).
[[bin]]
name = "otaku-decomp"
path = "src/bin/otaku_decomp.rs"

[dependencies]
# JNI bridge
jni = "0.21"

# Compression
flate2 = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
lz4_flex = { version = "0.14", default-features = false, features = ["frame"] }
# bzip2: bumped from 0.4 → 0.6 (latest stable).
# 0.6 uses libbz2-rs-sys (pure Rust) instead of C bindings — better for
# Android NDK cross-compile (no need to bundle libbz2 C source). API is
# unchanged: BzEncoder::new, Compression::new(u32), BzDecoder::new.
# Changelog: https://github.com/gendx/bzip2-rs/releases
bzip2 = "0.6"
xz2 = "0.1"
# DEMOTED: brotli = "6.0" — removed from APK build (compress + decompress).
# ZSTD (Zstandard): high compression ratio with fast decompression.
# Uses libzstd-sys (C bindings to Facebook's zstd library) — the same
# library used by RapidFlasher. Cross-compiles to Android NDK (arm64/armv7)
# by building libzstd from source (cc crate bundles the C code) — no
# pkg-config or system libzstd needed for cross-compile.
# NOTE: Do NOT add "pkg-config" feature — it breaks Android NDK cross-compile
# because pkg-config cannot find target-architecture libraries.
# T49: zstdmt compiles libzstd with ZSTD_MULTITHREAD — multi-thread capable
# build. Single-frame decompression stays single-thread (inherent to the
# format); MT engages for multi-frame streams and is a prerequisite for any
# future MT encoder switch on the app side.
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

# Hashing
sha2 = "0.10"

# Protobuf
prost = "0.12"

# Serialization (for JNI result passing)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ZIP creation
# zip: bumped from 2.1 → 2.4 (latest stable in 2.x series).
# 2.4 includes bug fixes for ZIP64 large files (>4GB) and improved
# SimpleFileOptions API (backward compatible).
# Note: 9.x is pre-release — not for production.
zip = "2.4"

# Date/time for flash_info.txt timestamps
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Logging
log = "0.4"
android_logger = "0.14"

[build-dependencies]
prost-build = "0.12"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true
strip = true
codegen-units = 1
